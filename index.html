<!DOCTYPE html>

        body {
            font-family: 'Kosugi Maru', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* アーケード筐体風フレーム */
        .arcade-frame {
            border: 8px solid #ff758c;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15), inset 0 0 15px rgba(255,255,255,0.6);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
        }

        /* クレーンのケーブルとアーム */
        .crane-cable {
            width: 4px;
            background-color: #475569;
            transition: height 0.05s linear;
        }

        .crane-claw {
            transition: transform 0.2s ease-in-out;
        }

        .claw-open .claw-left {
            transform: rotate(-30deg);
        }
        .claw-open .claw-right {
            transform: rotate(30deg);
        }
        .claw-closed .claw-left {
            transform: rotate(10deg);
        }
        .claw-closed .claw-right {
            transform: rotate(-10deg);
        }

        /* 文字カード */
        .char-card {
            box-shadow: 0 4px 6px rgba(0,0,0,0.1), inset 0 2px 0 rgba(255,255,255,0.8);
            transition: all 0.2s ease;
        }
        .char-card:hover {
            transform: translateY(-2deg);
        }

        /* アニメーション */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6deg); }
        }
        .animate-float {
            animation: float 2.5s infinite ease-in-out;
        }
    </style>
</head>

    <!-- JavaScript ロジック -->
    <script>
        // ユーティリティ: Sleep関数
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        // ユーティリティ: 配列のシャッフル (フィッシャー–イェーツ)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        /* --- サウンド効果音合成（Web Audio API） --- */
        class SoundEffects {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) {
                        this.ctx = new AudioCtx();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playMove() {
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e) {}
            }

            playCatch() {
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.15);
                } catch(e) {}
            }

            playSuccess() {
                this.init();
                if (!this.ctx) return;
                try {
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.3);
                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(this.ctx.currentTime + idx * 0.1);
                        osc.stop(this.ctx.currentTime + idx * 0.1 + 0.3);
                    });
                } catch(e) {}
            }

            playWrong() {
                this.init();
                if (!this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.3);
                } catch(e) {}
            }
        }

        const sound = new SoundEffects();

        /* --- 図形問題データ --- */
        const SHAPE_PROBLEMS = [

        /* --- 計算問題データ --- */
        const MATH_PROBLEMS = [
            { question: "3 + 2 = ?", answer: "5", dummies: ["4", "6", "8"] },

        /* --- 漢字問題データ（読み方＆漢字選び） --- */
        const KANJI_PROBLEMS = [
            { kanji: "犬", reading: "いぬ", dummiesReading: ["ねこ", "くま", "とり"], dummiesKanji: ["猫", "熊", "鳥"] },
            { kanji: "山", reading: "やま", dummiesReading: ["川", "海", "空"], dummiesKanji: ["川", "海", "空"] },
            { kanji: "車", reading: "くるま", dummiesReading: ["でんしゃ", "ふね", "ひこうき"], dummiesKanji: ["電", "船", "飛"] },

            currentProblemIndex = 0;

            loadProblem(currentProblemIndex);
            setupEventListeners();
        }

        /* --- クレーン操作・位置の更新 --- */
        function updateCranePosition() {
            craneAssembly.style.left = `${craneXPercent}%`;
            craneCable.style.height = `${craneCableHeight}px`;
        }

        function setClawOpen(isOpen) {
            if (isOpen) {
                craneClaw.classList.remove('claw-closed');
                craneClaw.classList.add('claw-open');
            } else {
                craneClaw.classList.remove('claw-open');
                craneClaw.classList.add('claw-closed');
            }
        }

        function moveCrane(deltaX) {
            if (isBusy) return;
            craneXPercent = Math.max(10, Math.min(90, craneXPercent + deltaX));
            updateCranePosition();
        }

        async function executeGrabSequence() {
            if (isBusy) return;
            isBusy = true;

            // クレーンを下げる
            setClawOpen(true);
            const initialHeight = craneCableHeight;
            const targetHeight = 150; // キャッチ位置まで伸長

            for (let h = initialHeight; h <= targetHeight; h += 5) {
                craneCableHeight = h;
                updateCranePosition();
                await sleep(15);
            }

            setClawOpen(false);
            sound.playCatch();
            await sleep(200);

            // 一番近いカードを検知して掴む
            const cards = Array.from(cardsContainer.children);
            const clawRect = craneClaw.getBoundingClientRect();
            const clawCenterX = clawRect.left + clawRect.width / 2;

            let grabbedCard = null;
            let minDistance = Infinity;

            cards.forEach(card => {
                const cardRect = card.getBoundingClientRect();
                const cardCenterX = cardRect.left + cardRect.width / 2;
                const dist = Math.abs(cardCenterX - clawCenterX);
                if (dist < 45 && dist < minDistance) {
                    minDistance = dist;
                    grabbedCard = card;
                }
            });

            if (grabbedCard) {
                // カードを爪にアタッチ
                grabbedCard.style.transition = 'none';
                craneClaw.appendChild(grabbedCard);
                grabbedCard.style.position = 'absolute';
                grabbedCard.style.top = '20px';
                grabbedCard.style.left = '50%';
                grabbedCard.style.transform = 'translateX(-50%)';
            }

            // クレーンを上げる
            for (let h = targetHeight; h >= initialHeight; h -= 5) {
                craneCableHeight = h;
                updateCranePosition();
                await sleep(15);
            }

            // カードを掴めた場合、空いている最初のスロットに格納
            if (grabbedCard) {
                const emptySlotIndex = currentAnswer.findIndex(val => val === '');
                if (emptySlotIndex !== -1) {
                    const char = grabbedCard.dataset.char;
                    currentAnswer[emptySlotIndex] = char;

                    const slots = answerSlotsContainer.children;
                    const targetSlot = slots[emptySlotIndex];

                    grabbedCard.remove();
                    targetSlot.textContent = char;
                    targetSlot.classList.add('bg-pink-100', 'border-pink-500');
                } else {
                    // 空きスロットがない場合はカードを戻す
                    cardsContainer.appendChild(grabbedCard);
                    grabbedCard.style.position = 'static';
                    grabbedCard.style.transform = 'none';
                }
            }

            setClawOpen(true);
            isBusy = false;

            // 回答判定
            checkAnswer();
        }

        function setGameMode(mode) {
            if (gameMode === mode) return;
            gameMode = mode;

            const inactiveClass = "px-2 sm:px-3 py-1 rounded-xl text-xs font-bold transition-all text-pink-700 hover:text-pink-900";
            const activeClass = "px-2 sm:px-3 py-1 rounded-xl text-xs font-bold transition-all bg-pink-500 text-white shadow";

            [btnModeHiragana, btnModeKatakana, btnModeEnglish, btnModeShape, btnModeMath, btnModeKanjiRead, btnModeKanjiWrite].forEach(btn => {
                btn.className = inactiveClass;
            });

            if (gameMode === 'hiragana') {
                btnModeHiragana.className = activeClass;
                instructionText.textContent = "ボタンを おして ひらがなを つかもう！";
            } else if (gameMode === 'katakana') {
                btnModeKatakana.className = activeClass;
                instructionText.textContent = "ボタンを オシテ カタカナヲ ツカモウ！";
            } else if (gameMode === 'english') {
                btnModeEnglish.className = activeClass;
                instructionText.textContent = "ボタンを押して えいご（ABC）をつかもう！";
            } else if (gameMode === 'shape') {
                btnModeShape.className = activeClass;
                instructionText.textContent = "かたちの なまえの ひらがなをつかもう！";
            } else if (gameMode === 'math') {
                btnModeMath.className = activeClass;
                instructionText.textContent = "けいさんの こたえの すうじをつかもう！";
            } else if (gameMode === 'kanji-read') {
                btnModeKanjiRead.className = activeClass;
                instructionText.textContent = "かんじの よみかた（ひらがな）をつかもう！";
            } else if (gameMode === 'kanji-write') {
                btnModeKanjiWrite.className = activeClass;
                instructionText.textContent = "よみにあう 正しい「かんじ」をつかもう！";
            }

            currentProblemIndex = 0;
            loadProblem(currentProblemIndex);
        }

        function loadProblem(index) {
            isBusy = false;
            let targetAnswer = "";
            let options = [];

            if (['hiragana', 'katakana', 'english'].includes(gameMode)) {
                const rawProblem = PICTURE_PROBLEMS[index % PICTURE_PROBLEMS.length];
                imageContainer.innerHTML = rawProblem.svg;

                let name = rawProblem.name;
                let dummies = [...rawProblem.dummies];

                if (gameMode === 'english') {
                    name = rawProblem.english;
                    dummies = [...rawProblem.englishDummies];
                } else if (gameMode === 'katakana') {
                    name = hiraToKata(name);
                    dummies = dummies.map(d => hiraToKata(d));
                } else if (rawProblem.isKatakanaNative) {
                    name = name.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
                    dummies = dummies.map(d => d.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60)));
                }

                targetAnswer = name;
                options = [...name.split(''), ...dummies];
            } 
            else if (gameMode === 'shape') {
                const rawProblem = SHAPE_PROBLEMS[index % SHAPE_PROBLEMS.length];
                imageContainer.innerHTML = rawProblem.svg;
                targetAnswer = rawProblem.name;
                options = [...rawProblem.name.split(''), ...rawProblem.dummies];
            }
            else if (gameMode === 'math') {
                const problem = MATH_PROBLEMS[index % MATH_PROBLEMS.length];
                imageContainer.innerHTML = `<div class="text-2xl sm:text-3xl font-black text-indigo-700">${problem.question}</div>`;
                targetAnswer = problem.answer;
                options = [problem.answer, ...problem.dummies];
            } 
            else if (gameMode === 'kanji-read') {
                const problem = KANJI_PROBLEMS[index % KANJI_PROBLEMS.length];
                imageContainer.innerHTML = `<div class="text-4xl sm:text-5xl font-black text-slate-800">${problem.kanji}</div>`;
                targetAnswer = problem.reading;
                options = [...problem.reading.split(''), ...problem.dummiesReading.join('').split('')];
            } 
            else if (gameMode === 'kanji-write') {
                const problem = KANJI_PROBLEMS[index % KANJI_PROBLEMS.length];
                imageContainer.innerHTML = `<div class="text-2xl sm:text-3xl font-black text-pink-600">${problem.reading}</div>`;
                targetAnswer = problem.kanji;
                options = [problem.kanji, ...problem.dummiesKanji];
            }

            currentAnswer = new Array(targetAnswer.length).fill('');

            // 文字枠生成
            answerSlotsContainer.innerHTML = '';
            for (let i = 0; i < targetAnswer.length; i++) {
                const slot = document.createElement('div');
                const slotSizeClass = targetAnswer.length > 5 ? "w-8 h-8 sm:w-10 sm:h-10 text-lg" : "w-10 h-10 sm:w-12 sm:h-12 text-xl sm:text-2xl";
                slot.className = `${slotSizeClass} border-2 border-dashed border-pink-400 bg-white rounded-xl flex items-center justify-center font-black text-pink-600 shadow-sm transition-all`;
                slot.dataset.index = i;
                answerSlotsContainer.appendChild(slot);
            }

            // カード作成と配置
            shuffleArray(options);
            cardsContainer.innerHTML = '';
            options.forEach((char, idx) => {
                const card = document.createElement('div');
                card.className = "char-card px-2 min-w-[2.5rem] h-10 sm:h-12 bg-amber-300 border-2 border-amber-500 rounded-2xl flex items-center justify-center font-black text-lg sm:text-xl text-amber-900 cursor-pointer transform hover:scale-105 active:scale-95";
                card.textContent = char;
                card.dataset.char = char;
                card.dataset.id = `card-${idx}`;
                cardsContainer.appendChild(card);
            });

            // クレーン初期位置
            craneXPercent = 50;
            craneCableHeight = 24;
            updateCranePosition();
            setClawOpen(true);
        }

        /* --- イベント割り当て --- */
        function setupEventListeners() {
            btnModeHiragana.onclick = () => setGameMode('hiragana');
            btnModeKatakana.onclick = () => setGameMode('katakana');
            btnModeEnglish.onclick = () => setGameMode('english');
            btnModeShape.onclick = () => setGameMode('shape');
            btnModeMath.onclick = () => setGameMode('math');
            btnModeKanjiRead.onclick = () => setGameMode('kanji-read');
            btnModeKanjiWrite.onclick = () => setGameMode('kanji-write');

            let moveInterval = null;

            const startMove = (dir) => {
                if (isBusy) return;
                sound.playMove();
                moveCrane(dir);
                if (!moveInterval) {
                    moveInterval = setInterval(() => moveCrane(dir), 50);
                }
            };

            const stopMove = () => {
                if (moveInterval) {
                    clearInterval(moveInterval);
                    moveInterval = null;
                }
            };

            // ボタン操作（マウス＆タッチ）
            btnLeft.onmousedown = () => startMove(-2);
            btnLeft.onmouseup = stopMove;
            btnLeft.onmouseleave = stopMove;
            btnLeft.ontouchstart = (e) => { e.preventDefault(); startMove(-2); };
            btnLeft.ontouchend = stopMove;

            btnRight.onmousedown = () => startMove(2);
            btnRight.onmouseup = stopMove;
            btnRight.onmouseleave = stopMove;
            btnRight.ontouchstart = (e) => { e.preventDefault(); startMove(2); };
            btnRight.ontouchend = stopMove;

            btnDrop.onclick = () => {
                if (!isBusy) executeGrabSequence();
            };

            modalNextBtn.onclick = () => {
                hideModal();
                currentProblemIndex++;
                loadProblem(currentProblemIndex);
            };
        }

        /* --- 解答チェック --- */
        function checkAnswer() {
            let targetAnswer = "";

            if (['hiragana', 'katakana', 'english'].includes(gameMode)) {
                const rawProblem = PICTURE_PROBLEMS[currentProblemIndex % PICTURE_PROBLEMS.length];
                targetAnswer = rawProblem.name;
                if (gameMode === 'english') targetAnswer = rawProblem.english;
                else if (gameMode === 'katakana') targetAnswer = hiraToKata(targetAnswer);
                else if (rawProblem.isKatakanaNative) targetAnswer = targetAnswer.replace(/[\u30a1-\u30f6]/g, m => String.fromCharCode(m.charCodeAt(0) - 0x60));
            } else if (gameMode === 'shape') {
                targetAnswer = SHAPE_PROBLEMS[currentProblemIndex % SHAPE_PROBLEMS.length].name;
            } else if (gameMode === 'math') {
                targetAnswer = MATH_PROBLEMS[currentProblemIndex % MATH_PROBLEMS.length].answer;
            } else if (gameMode === 'kanji-read') {
                targetAnswer = KANJI_PROBLEMS[currentProblemIndex % KANJI_PROBLEMS.length].reading;
            } else if (gameMode === 'kanji-write') {
                targetAnswer = KANJI_PROBLEMS[currentProblemIndex % KANJI_PROBLEMS.length].kanji;
            }

            const isFull = currentAnswer.every(val => val !== '');

            if (isFull) {
                const userAnswerStr = currentAnswer.join('');
                if (userAnswerStr === targetAnswer) {
                    score += 10;
                    scoreDisplay.textContent = score;
                    sound.playSuccess();

                    let msg = `「${targetAnswer}」 できたね！`;
                    if (gameMode === 'math') msg = `せいかい！ こたえは ${targetAnswer}！`;

                    setTimeout(() => {
                        showModal("🎉 せいかい！", msg, "🥳");
                    }, 300);
                } else {
                    sound.playWrong();
                    setTimeout(() => {
                        loadProblem(currentProblemIndex);
                    }, 600);
                }
            }
        }

        /* --- モーダル制御 --- */
        function showModal(title, msg, emoji = "🎉") {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = msg;
            document.getElementById('modal-emoji').textContent = emoji;
            modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-90');
            modalContent.classList.add('scale-100');
        }

        function hideModal() {
            modalOverlay.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-90');
        }
    </script>
